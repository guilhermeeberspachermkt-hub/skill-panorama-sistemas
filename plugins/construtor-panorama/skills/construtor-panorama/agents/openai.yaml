# Metadados para o Codex e o aplicativo do ChatGPT (o Claude ignora este arquivo).
# Formato: https://learn.chatgpt.com/docs/build-skills ("agents/openai.yaml").
interface:
  display_name: "Construtor Panorama"
  short_description: "Visual, temas de época e páginas de uma loja da Panorama Sistemas, com prévia e aprovação antes de gravar"
